plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '7.0.4'
}

spotless {
	java {
		target 'src/**/*.java'
		importOrder()
		removeUnusedImports()
		googleJavaFormat('1.35.0')
		formatAnnotations()
	}
}

tasks.named('check') {
	dependsOn 'spotlessCheck'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Xander Maven"
		url = "https://maven.isxander.dev/releases"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"patchwork" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation("dev.isxander:yet-another-config-lib:${project.yacl_version}")
	modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")
	
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Export .ase sprite sources in assets-src into the mod's texture dir before packaging.
// Uses the free pure-Python aseprite-reader (MIT); no Aseprite binary required.
// Runs under uv if available (auto-installs aseprite-reader), else the active Python.
// Output goes to build/generated/resources (not src/) so it never conflicts with source tasks.
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def findExec = { name ->
	try {
		def probe = isWindows ? ['cmd', '/c', 'where', name] : ['sh', '-c', "command -v $name"]
		def p = probe.execute()
		p.waitFor()
		return p.exitValue() == 0
	} catch (e) {
		return false
	}
}
def pythonHasAsepriteReader = {
	def py = findExec('python3') ? 'python3' : 'python'
	try {
		def p = [py, '-c', 'import aseprite_reader'].execute()
		p.waitFor()
		return p.exitValue() == 0
	} catch (e) {
		return false
	}
}

def generatedResources = file('build/generated/resources')

tasks.register('exportAsepriteTextures', Exec) {
	group = 'assets'
	description = 'Renders .ase files under assets-src into PNGs in the texture resources.'
	inputs.dir file('assets-src')
	outputs.dir generatedResources
	onlyIf { findExec('uv') || pythonHasAsepriteReader() }
	doFirst {
		def cmd = findExec('uv')
			? ['uv', 'run', '--with', 'aseprite-reader', 'python', 'assets-src/export.py']
			: [findExec('python3') ? 'python3' : 'python', 'assets-src/export.py']
		workingDir rootDir
		executable cmd.head()
		args = cmd.tail()
	}
}

processClientResources.dependsOn exportAsepriteTextures
sourceSets.client.resources.srcDir generatedResources

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	tasks.named('sourcesJar') { dependsOn exportAsepriteTextures }

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
